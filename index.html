<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <link rel="stylesheet" href="filters.css" />
    <link rel="stylesheet" href="nav.css">
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>
<body>
    <div id="header">
        <header>
            <img src="img/Logoversie2.svg" alt="koop hier je developer logo">
            <form action="">
                <input type="text" placeholder="Zoek naar jou favoriete WEB Developer...">
                <img src="img/search.png" alt="search">
            </form>
            <div>
                <img src="img/heart.svg" alt="favoriet">
                <img src="img/icon.svg" alt="icon">
                <img src="img/delivery-truck.svg" alt="winkelmandje">
            </div>
        </header>
    </div>

    <nav>
        <ul>
            <li>Trending</li>
            <li>Bestsellers</li>
            <li>oudere generatie</li>
            <li>jongere generatie</li>
            <li>avatar</li>
            <li>geen avatar</li>
        </ul>
    </nav>

    <main>

        <section>
            <h1> Jouw perfecte persoon, </h1>
            <h2> <span>vandaag</span> nog geleverd!</h2>
        </section>
        <!-- for the filters -->
        <div id="market">
        <div id="filter-block">
                <details>
                  <summary>Ages</summary>
                  <div>
                    <label for="age1"
                      >young
                      <input type="checkbox" id="age1" />
                    </label>
          
                    <label for="age2"
                      >normal
                      <input type="checkbox" id="age2" />
                    </label>
          
                    <label for="age3"
                      >old
                      <input type="checkbox" id="age3" />
                    </label>
                  </div>
                </details>
          
                <details>
                  <summary>Rating</summary>
                  <div>
                    <label for="r1"
                      >1 star
                      <input type="checkbox" id="r1" />
                    </label>
                    <label for="r2"
                      >2 stars
                      <input type="checkbox" id="r2" />
                    </label>
                    <label for="r3"
                      >3 stars
                      <input type="checkbox" id="r3" />
                    </label>
                    <label for="r4"
                      >4 stars
                      <input type="checkbox" id="r4" />
                    </label>
                    <label for="r5"
                      >5 stars
                      <input type="checkbox" id="r5" />
                    </label>
                  </div>
                </details>

                <details>
                    <summary>Price</summary>
                    <div>
                      <label for="price1"
                        >Cheap
                        <input type="checkbox" id="price1" />
                      </label>
            
                      <label for="price2"
                        >Expensive
                        <input type="checkbox" id="price2" />
                      </label>
                    </div>
                  </details>
        </div>
        
        <!-- for the cards -->
        <div id="card-block">
            <section>
            </section>
        </div>
        </div>
    </main>
    <script src="fetch.js"></script>
</body>
</html>
